<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Workstation</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #1e1e2e;
            color: #cdd6f4;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        header {
            background-color: #181825;
            padding: 16px 24px;
            font-size: 1.1rem;
            font-weight: 600;
            border-bottom: 1px solid #313244;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .status-dot {
            width: 10px; height: 10px;
            background-color: #a6e3a1;
            border-radius: 50%;
        }
        #chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .message {
            max-width: 75%;
            padding: 14px 18px;
            border-radius: 16px;
            font-size: 0.95rem;
            line-height: 1.6;
            white-space: pre-wrap;
            word-wrap: break-word;
        }
        .user {
            background-color: #89b4fa;
            color: #11111b;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }
        .bot {
            background-color: #313244;
            color: #cdd6f4;
            align-self: flex-start;
            border-bottom-left-radius: 4px;
            border: 1px solid #45475a;
        }
        #input-container {
            padding: 16px 24px;
            background-color: #181825;
            border-top: 1px solid #313244;
            display: flex;
            gap: 12px;
        }
        textarea {
            flex: 1;
            background-color: #313244;
            border: 1px solid #45475a;
            color: #cdd6f4;
            padding: 14px 16px;
            border-radius: 12px;
            resize: none;
            outline: none;
            font-size: 0.95rem;
            font-family: inherit;
            height: 48px;
        }
        textarea:focus { border-color: #89b4fa; }
        button {
            background-color: #89b4fa;
            color: #11111b;
            border: none;
            padding: 14px 22px;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            height: 48px;
        }
        button:disabled { background-color: #45475a; color: #a6adc8; }
    </style>
</head>
<body>
    <header>
        <span class="status-dot"></span>
        <span>24/7 AI Assistant</span>
    </header>

    <div id="chat-container">
        <div class="message bot">Hello! How can I help you today?</div>
    </div>

    <div id="input-container">
        <textarea id="prompt" placeholder="Type a message..."></textarea>
        <button id="send-btn" onclick="sendPrompt()">Send</button>
    </div>

    <script>
        const textarea = document.getElementById('prompt');
        const chatContainer = document.getElementById('chat-container');
        const sendBtn = document.getElementById('send-btn');

        textarea.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendPrompt();
            }
        });

        async function sendPrompt() {
            const prompt = textarea.value.trim();
            if (!prompt) return;

            const userMsg = document.createElement('div');
            userMsg.className = 'message user';
            userMsg.innerText = prompt;
            chatContainer.appendChild(userMsg);

            textarea.value = '';
            sendBtn.disabled = true;

            const botMsg = document.createElement('div');
            botMsg.className = 'message bot';
            botMsg.innerText = 'Thinking...';
            chatContainer.appendChild(botMsg);
            chatContainer.scrollTop = chatContainer.scrollHeight;

            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt })
                });

                botMsg.innerText = '';
                const reader = response.body.getReader();
                const decoder = new TextDecoder();

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    botMsg.innerText += decoder.decode(value, { stream: true });
                    chatContainer.scrollTop = chatContainer.scrollHeight;
                }
            } catch (err) {
                botMsg.innerText = "Error connecting to cloud service.";
            } finally {
                sendBtn.disabled = false;
                textarea.focus();
            }
        }
    </script>
</body>
</html>
